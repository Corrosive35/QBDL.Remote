# Publication de l'APK signée.
#
# Pousser un tag « v<versionName> » (par exemple v1.2) compile l'APK sur les serveurs de GitHub,
# la signe avec le keystore de release et l'attache à une Release du même nom. Rien ne se compile
# en local : une version se livre sans ouvrir Android Studio.
#
# Lancement manuel (onglet Actions → « Release APK » → « Run workflow »), sur n'importe quelle
# branche : même compilation, même signature, mais l'APK reste un artefact du run, téléchargeable
# depuis sa page pendant 14 jours, sans Release publiée. Utile pour essayer une branche sur le
# téléphone avant de la livrer.
#
# Livrer une version : incrémenter versionCode et versionName dans app/build.gradle.kts, committer,
# puis poser et pousser le tag correspondant :
#   git tag -a v1.2 -m "QBDL Remote 1.2" && git push origin main v1.2
# Quelques minutes plus tard, la Release v1.2 apparaît avec QBDL.Remote-v1.2.apk en pièce jointe,
# à ouvrir directement depuis le téléphone. Le tag doit valoir exactement « v » + versionName :
# sinon le workflow s'arrête avant de compiler, plutôt que de publier une « v1.2 » qui
# s'annoncerait autrement dans les paramètres Android.
#
# Secrets attendus (Settings → Secrets and variables → Actions → New repository secret), à créer
# une fois pour toutes à partir du keystore de release (voir « Signature release » dans le README
# pour le générer) :
#
#   QDLR_KEYSTORE_BASE64   le fichier .jks, encodé en base64 (voir ci-dessous)
#   QDLR_STORE_PASSWORD    mot de passe du keystore
#   QDLR_KEY_ALIAS         qdlr
#   QDLR_KEY_PASSWORD      mot de passe de la clé — le même que le précédent pour un keystore
#                          créé par keytool
#
# Encodage du keystore, sous Windows (PowerShell, le résultat part dans le presse-papiers) :
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("$HOME\qdlr-release.jks")) | Set-Clipboard
# Sous Linux (base64 -i sous macOS) :
#   base64 -w0 ~/qdlr-release.jks
#
# Il faut le même keystore que celui de l'APK déjà installée sur le téléphone : signée par une
# autre clé, la nouvelle version serait refusée à l'installation.
#
# Quiconque a les droits d'écriture sur le dépôt peut modifier ce workflow et lire ces secrets :
# ne les accordez à personne d'autre. Le dépôt peut rester public sans risque : une pull request
# venue d'un fork ne reçoit pas les secrets, et le workflow ne se déclenche que sur un tag ou un
# lancement manuel, deux actions réservées aux comptes ayant l'écriture.

name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # gh release create / upload

# Deux pushs du même tag ne doivent pas se disputer la même Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::versionName introuvable dans app/build.gradle.kts."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à versionName = \"$version\" (app/build.gradle.kts). Attendu : v$version."
              exit 1
            fi
            echo "apk=QBDL.Remote-v$version.apk" >> "$GITHUB_OUTPUT"
          else
            echo "apk=QBDL.Remote-v$version-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          fi

      # AGP 8.7 exige JDK 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Le wrapper Gradle n'est pas versionné (c'est un binaire) : on installe directement la
      # version qu'il désigne dans gradle-wrapper.properties.
      #
      # Volontairement en v5 et non en v6 : depuis la v6, le cache de cette action est un
      # composant propriétaire, et l'adopter vaut acceptation des conditions d'utilisation de
      # Gradle (https://blog.gradle.org/github-actions-for-gradle-v6). La v5 tourne déjà sous
      # Node 24 et reste sous licence MIT.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      # Sans keystore, build.gradle.kts produit silencieusement une APK non signée, que le
      # téléphone refuse d'installer : mieux vaut échouer ici avec un message clair. Le keystore
      # n'existe sur le runner que le temps du job, dans un répertoire temporaire.
      - name: Keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.QDLR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QDLR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QDLR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QDLR_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing QDLR_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ]  || missing="$missing QDLR_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]       || missing="$missing QDLR_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]    || missing="$missing QDLR_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets absents :$missing. Voir l'en-tête de .github/workflows/release.yml."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Les mots de passe passent en -P plutôt que par un gradle.properties écrit à la volée : la
      # syntaxe .properties interprète les barres obliques inverses, qu'un mot de passe peut
      # contenir. GitHub masque les valeurs des secrets dans le journal.
      - name: Compilation
        env:
          STORE_PASSWORD: ${{ secrets.QDLR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QDLR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QDLR_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -PQDLR_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PQDLR_STORE_PASSWORD="$STORE_PASSWORD" \
            -PQDLR_KEY_ALIAS="$KEY_ALIAS" \
            -PQDLR_KEY_PASSWORD="$KEY_PASSWORD"

      # Garde-fou final : apksigner échoue sur une APK non signée, et l'empreinte du certificat
      # imprimée dans le journal doit être celle du keystore de release — c'est elle qui permet
      # à la nouvelle version de remplacer l'ancienne sur le téléphone sans désinstallation.
      - name: Vérification de la signature
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "$APK"

      - name: Publication de la Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          # Relancer le job sur un tag déjà publié remplace l'APK au lieu d'échouer.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      # archive: false livre l'APK telle quelle, au lieu d'un .zip à décompresser sur le
      # téléphone. L'artefact prend alors le nom du fichier : pas de paramètre name.
      - name: Artefact du run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.version.outputs.apk }}
          archive: false
          retention-days: 14
          if-no-files-found: error
